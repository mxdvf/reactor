[package]
name = "reactor-node"
version = "0.1.0"

rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
log.workspace = true
tokio.workspace = true
serde = { version = "1", features = ["derive"] }
libloading = "0.8"
axum = "0.8.4"
serde_json = "1.0"
tempfile = "3.20.0"
reactor-actor = { path = "../actor"}
# env_logger = "0.11"
thiserror.workspace = true
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6.4", features = ["trace"] }
tracing-log = "0.2.0"
tracing-shared = "0.1.5"
utoipa = {version="5.3.1", features=["axum_extras"], optional = true}
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true}
cargo_toml = {version = "0.22", optional = true}

opentelemetry = { version = "0.30.0", features = ["trace", "metrics"], optional=true}
opentelemetry_sdk = { version = "0.30.0", default-features = false, features = ["trace", "rt-tokio", "experimental_metrics_custom_reader"], optional=true}
opentelemetry-otlp = { version = "0.30.0", features = ["metrics", "grpc-tonic"], optional=true}
opentelemetry-semantic-conventions = { version = "0.30.0", features = ["semconv_experimental"], optional=true}
tracing-core = { version = "0.1.34", optional=true}
tracing-opentelemetry = {version="0.31.0", optional=true}
opentelemetry-stdout = { version = "0.30.0", features = ["trace", "metrics"], optional=true}



[features]
default = ["swagger", "instrument"]
swagger = ["utoipa-swagger-ui", "utoipa"]
dynop = ["cargo_toml"]
instrument = ["opentelemetry_sdk", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "opentelemetry", "tracing-core", "tracing-opentelemetry", "opentelemetry-stdout"]
