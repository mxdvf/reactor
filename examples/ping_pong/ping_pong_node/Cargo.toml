[package]
name = "ping_pong_node"
version = "0.1.0"
edition = "2024"


[dependencies]
env_logger = "0.11.8"
tokio = { version = "1", features = ["full", "tracing"] }
reactor-node = { path = "../../../node" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.140"


[features]
default = []
dynop = ["reactor-node/dynop"]
swagger = ["reactor-node/swagger"]
